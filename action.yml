name: "Private AI PR Reviewer by Cody Labs"
description: "High-signal BYOK pull request reviews that run privately in GitHub Actions"
inputs:
  # GitHub does not enforce `required` for composite-action inputs: a workflow that
  # omits them gets empty strings, not an error. Every context-derivable input therefore
  # defaults from the event so the minimal `uses:` workflow works out of the box.
  pr_number:
    description: "Pull request number; defaults to the PR that triggered pull_request or pull_request_target"
    required: false
    default: ${{ github.event.pull_request.number }}
  repository:
    description: "Repository name; defaults to the repository running the workflow"
    required: false
    default: ${{ github.repository }}
  github_token:
    description: "GitHub token used to read the pull request and post the review; defaults to the workflow's token (needs pull-requests: write)"
    required: false
    default: ${{ github.token }}
  openai_api_key:
    description: "OpenAI API key; required when using an OpenAI model"
    required: false
  anthropic_api_key:
    description: "Anthropic API key; required when using a Claude model"
    required: false
  model:
    description: "OpenAI or Anthropic model ID used for the review"
    required: false
    default: "gpt-5.6-luna"
  max_review_rounds:
    description: >-
      Maximum number of reviews Cody will post on a single pull request.
      0 (the default) means unlimited, which matches the action's behavior
      before this input existed: existing workflows that do not set it see
      no change. Once the cap is reached Cody posts a short note once and
      exits successfully without reviewing again. Add the `cody:force-review`
      label to the pull request, or re-run the workflow manually, to get one
      more review despite the cap.
    required: false
    default: "0"
  review_instructions:
    description: "Optional repository-specific priorities appended by the workflow owner"
    required: false
    default: ""
  exclude_paths:
    description: "Comma-separated glob patterns excluded from review"
    required: false
    default: "node_modules/**,**/node_modules/**,dist/**,**/dist/**,venv/**,**/venv/**,.venv/**,**/.venv/**"
  context_files:
    description: "Comma-separated guidance files read from the trusted base commit"
    required: false
    default: "AGENTS.md,REVIEW.md,CLAUDE.md,.github/copilot-instructions.md"
  max_diff_chars:
    description: "Maximum diff characters sent to the model; use this to cap review cost"
    required: false
    default: "200000"
  update_existing_comment:
    description: "Replace Cody's previous PR comment on each push instead of adding noise"
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - name: Check pull request context
      run: |
        failed=0
        if [[ -z "$PR_NUMBER" ]]; then
          echo "::error title=Cody needs a pull request::No pull request number available. Run this action on pull_request_target or pull_request events, or pass the pr_number input explicitly."
          failed=1
        fi
        if [[ -z "$REPOSITORY" ]]; then
          echo "::error title=Cody needs a repository::The repository input resolved empty. Omit it to use the current repository, or pass owner/name explicitly."
          failed=1
        fi
        if [[ -z "$GITHUB_TOKEN" ]]; then
          echo "::error title=Cody needs a token::The github_token input resolved empty. Omit it to use the workflow token (with pull-requests: write), or pass one explicitly."
          failed=1
        fi
        exit "$failed"
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}
        REPOSITORY: ${{ inputs.repository }}
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: Set up Python 3.13
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.13"

    - name: Create isolated action environment
      run: |
        python -m venv "$CODY_VENV"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          action_python="$CODY_VENV/Scripts/python.exe"
        else
          action_python="$CODY_VENV/bin/python"
        fi
        echo "CODY_PYTHON=$action_python" >> "$GITHUB_ENV"
        "$action_python" -m pip install --require-hashes -r "$GITHUB_ACTION_PATH/requirements.lock"
      shell: bash
      env:
        CODY_VENV: ${{ runner.temp }}/cody-review-venv-${{ github.run_id }}-${{ github.run_attempt }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        RUNNER_OS: ${{ runner.os }}

    - name: Check review round cap
      id: round_cap
      run: |
        "$CODY_PYTHON" "$GITHUB_ACTION_PATH/src/round_cap.py" "$PR_NUMBER" "$REPOSITORY"
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        MAX_REVIEW_ROUNDS: ${{ inputs.max_review_rounds }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPOSITORY: ${{ inputs.repository }}
        RUN_ATTEMPT: ${{ github.run_attempt }}

    - name: Run Code Review Model
      if: steps.round_cap.outputs.should_review == 'true'
      run: |
        "$CODY_PYTHON" "$GITHUB_ACTION_PATH/src/review_pull_request.py" "$PR_NUMBER" "$REPOSITORY"
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        MODEL: ${{ inputs.model }}
        REVIEW_INSTRUCTIONS: ${{ inputs.review_instructions }}
        EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        CONTEXT_FILES: ${{ inputs.context_files }}
        MAX_DIFF_CHARS: ${{ inputs.max_diff_chars }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPOSITORY: ${{ inputs.repository }}
        REVIEW_OUTPUT: ${{ runner.temp }}/cody-review-${{ github.run_id }}-${{ github.run_attempt }}.md

    - name: Comment on Pull Request
      if: steps.round_cap.outputs.should_review == 'true'
      run: |
        "$CODY_PYTHON" "$GITHUB_ACTION_PATH/src/comment_on_pr.py" "$PR_NUMBER" "$REPOSITORY"
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        # MODEL is needed here too: the posted header names the review model, and
        # without it the comment step would stamp the default model regardless of
        # which model actually produced the review.
        MODEL: ${{ inputs.model }}
        UPDATE_EXISTING_COMMENT: ${{ inputs.update_existing_comment }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPOSITORY: ${{ inputs.repository }}
        REVIEW_OUTPUT: ${{ runner.temp }}/cody-review-${{ github.run_id }}-${{ github.run_attempt }}.md
branding:
  icon: 'shield'
  color: 'blue'
