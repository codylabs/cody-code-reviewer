name: "Cody AI Code Reviewer"
description: "Review pull requests with OpenAI or Anthropic Claude models"
inputs:
  # GitHub does not enforce `required` for composite-action inputs: a workflow that
  # omits them gets empty strings, not an error. Every context-derivable input therefore
  # defaults from the event so the minimal `uses:` workflow works out of the box.
  pr_number:
    description: "Pull request number; defaults to the number of the PR that triggered the workflow"
    required: false
    default: ${{ github.event.pull_request.number }}
  repository:
    description: "Repository name; defaults to the repository running the workflow"
    required: false
    default: ${{ github.repository }}
  github_token:
    description: "GitHub token used to read the pull request and post the review; defaults to the workflow's token (needs pull-requests: write)"
    required: false
    default: ${{ github.token }}
  openai_api_key:
    description: "OpenAI API key; required when using an OpenAI model"
    required: false
  anthropic_api_key:
    description: "Anthropic API key; required when using a Claude model"
    required: false
  model:
    description: "OpenAI or Anthropic model ID used for the review"
    required: false
    default: "gpt-5.6-luna"
runs:
  using: "composite"
  steps:
    - name: Check pull request context
      run: |
        if [[ -z "$PR_NUMBER" ]]; then
          echo "::error title=Cody needs a pull request::No pull request number available. Run this action on pull_request events, or pass the pr_number input explicitly."
          exit 1
        fi
      shell: bash
      env:
        PR_NUMBER: ${{ inputs.pr_number }}

    - name: Set up Python 3.13
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.13"

    - name: Create isolated action environment
      run: |
        python -m venv "$CODY_VENV"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          action_python="$CODY_VENV/Scripts/python.exe"
        else
          action_python="$CODY_VENV/bin/python"
        fi
        echo "CODY_PYTHON=$action_python" >> "$GITHUB_ENV"
        "$action_python" -m pip install --require-hashes -r "$GITHUB_ACTION_PATH/requirements.lock"
      shell: bash
      env:
        CODY_VENV: ${{ runner.temp }}/cody-review-venv-${{ github.run_id }}-${{ github.run_attempt }}
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        RUNNER_OS: ${{ runner.os }}

    - name: Run Code Review Model
      run: |
        "$CODY_PYTHON" "$GITHUB_ACTION_PATH/src/review_pull_request.py" "$PR_NUMBER" "$REPOSITORY"
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        OPENAI_API_KEY: ${{ inputs.openai_api_key }}
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        MODEL: ${{ inputs.model }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPOSITORY: ${{ inputs.repository }}
        REVIEW_OUTPUT: ${{ runner.temp }}/cody-review-${{ github.run_id }}-${{ github.run_attempt }}.md

    - name: Comment on Pull Request
      run: |
        "$CODY_PYTHON" "$GITHUB_ACTION_PATH/src/comment_on_pr.py" "$PR_NUMBER" "$REPOSITORY"
      shell: bash
      env:
        GITHUB_ACTION_PATH: ${{ github.action_path }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        PR_NUMBER: ${{ inputs.pr_number }}
        REPOSITORY: ${{ inputs.repository }}
        REVIEW_OUTPUT: ${{ runner.temp }}/cody-review-${{ github.run_id }}-${{ github.run_attempt }}.md
branding:
  icon: 'award'
  color: 'green'
