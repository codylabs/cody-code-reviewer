name: Test

# The push trigger was removed 2026-08-26 to preserve the free GitHub Actions
# allowance, since it ran the identical job as the pull_request trigger and
# every merge cost two runs. Cody's review of PR #37 pushed back, correctly:
# unlike the sibling repos this one has NO pre-commit hook, so with push gone a
# direct push to master, or any merge made outside a pull request, would have
# had no test gate anywhere, local or remote.
#
# Restored, but narrowed to master only rather than all branches. Feature-branch
# pushes are still covered by the pull_request run alone, which is where the
# duplication actually was. This costs one short run per merge on one repo,
# which is the right trade against having no gate on the product's own code.
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.30"

      - name: Verify dependency lock
        run: |
          cp requirements.lock "$RUNNER_TEMP/requirements.lock"
          cp requirements-dev.lock "$RUNNER_TEMP/requirements-dev.lock"
          uv pip compile \
            --python-version 3.13 \
            --generate-hashes \
            --no-header \
            requirements.txt \
            -o "$RUNNER_TEMP/requirements.lock"
          uv pip compile \
            --python-version 3.13 \
            --generate-hashes \
            --no-header \
            requirements-dev.txt \
            -o "$RUNNER_TEMP/requirements-dev.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"
          diff -u requirements-dev.lock "$RUNNER_TEMP/requirements-dev.lock"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run unit tests
        run: python -m pytest -m "not integration"
