name: Test

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.30"

      - name: Verify dependency lock
        run: |
          cp requirements.lock "$RUNNER_TEMP/requirements.lock"
          cp requirements-dev.lock "$RUNNER_TEMP/requirements-dev.lock"
          uv pip compile \
            --python-version 3.13 \
            --generate-hashes \
            --no-header \
            requirements.txt \
            -o "$RUNNER_TEMP/requirements.lock"
          uv pip compile \
            --python-version 3.13 \
            --generate-hashes \
            --no-header \
            requirements-dev.txt \
            -o "$RUNNER_TEMP/requirements-dev.lock"
          diff -u requirements.lock "$RUNNER_TEMP/requirements.lock"
          diff -u requirements-dev.lock "$RUNNER_TEMP/requirements-dev.lock"

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock

      - name: Run unit tests
        run: python -m pytest -m "not integration"
