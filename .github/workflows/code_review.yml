name: Automated Code Review by Cody

on:
  # The reviewer needs a provider key and a write-capable PR token. Running the
  # workflow definition from the protected base branch lets it review forks safely,
  # provided this job never checks out or executes pull-request-controlled code.
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  code_review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Review pull request
        # Pinned to a published release SHA: PR-controlled code must never run
        # with this job's secrets (Cody's own review flagged the uses: ./ form).
        uses: codylabs/cody-code-reviewer@b44126ce4a0de75f449281504b1226d94205ecb9 # v1.6.0
        with:
          pr_number: ${{ github.event.pull_request.number }}
          repository: ${{ github.repository }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          openai_api_key: ${{ secrets.OPENAI_API_KEY }}
          model: gpt-5.6-luna
          # To switch to Claude, replace the two lines above with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # model: claude-opus-4-8
