name: Channel health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check canonical Cody channels
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for url in \
            "https://github.com/codylabs/cody-code-reviewer#install" \
            "https://github.com/marketplace/actions/cody-ai-code-reviewer" \
            "https://docs.codylabs.uk/" \
            "https://codylabs.uk/"; do
            curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 \
              --silent --show-error --output /dev/null "$url"
          done

          # The checkout link needs a stronger assertion than "some page loaded".
          # A dead Polar checkout link 302s to the bare https://polar.sh/ homepage,
          # which returns 200, so `curl --fail --location` passes on a link nobody
          # can buy through. That is not hypothetical: this check was green for
          # months while Cody Pro could not be purchased at all. Assert the final
          # URL is an actual checkout page instead.
          # --fail matters here, and Cody's review of PR #37 caught its absence.
          # Without it curl treats a 404 or 500 as success, so a dead checkout that
          # still happens to land on a polar.sh/checkout/ URL would pass the case
          # statement below. --retry also does not retry HTTP failures without it.
          checkout_url="https://buy.polar.sh/polar_cl_W4b0Q17WmOuaYMK74997DoQmQa7P8K7o0jppV18t1f0"
          checkout_body="$(mktemp)"
          final_url="$(curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 \
            --silent --show-error --output "$checkout_body" --write-out '%{url_effective}' "$checkout_url")"
          case "$final_url" in
            https://polar.sh/checkout/*) ;;
            *)
              echo "Cody Pro checkout link is dead: $checkout_url landed on $final_url" >&2
              echo "A working link resolves to https://polar.sh/checkout/..." >&2
              exit 1
              ;;
          esac
          # URL shape alone does not prove the checkout is usable, so assert the
          # advertised price is actually on the page. Advertised price must match
          # what the checkout charges is a standing rule, and this is where a
          # silent price drift would otherwise go unnoticed.
          if ! grep -q '\$39' "$checkout_body"; then
            echo "Cody Pro checkout no longer shows the expected \$39 price: $final_url" >&2
            exit 1
          fi

          readme="$(curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 \
            --silent --show-error \
            https://raw.githubusercontent.com/codylabs/cody-code-reviewer/master/README.md)"
          grep --fixed-strings --quiet --line-regexp '## Install' <<< "$readme"

          latest_release="$(curl --fail --retry 3 --connect-timeout 10 --max-time 60 --silent --show-error \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/codylabs/cody-code-reviewer/releases/latest \
            | python -c 'import json, sys; print(json.load(sys.stdin)["tag_name"])')"
          marketplace_page="$(curl --fail --location --retry 3 --connect-timeout 10 --max-time 60 --silent --show-error \
            https://github.com/marketplace/actions/cody-ai-code-reviewer)"
          grep --fixed-strings --quiet "$latest_release" <<< "$marketplace_page"
